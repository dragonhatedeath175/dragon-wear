services:
  - type: web
    name: dragon-wear
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      # Add PAYSTACK_SECRET_KEY in Render Dashboard when payments are ready.
